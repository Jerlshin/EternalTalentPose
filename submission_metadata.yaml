# ============================================================================
# Approach summary
# ============================================================================
methodology_summary: "RedStack is a deterministic, evidence-grounded ranking system split into an unbounded offline build and a strictly constrained, CPU-only online pipeline. The offline phase pre-computes dense candidate embeddings via sentence-transformers, calibrates scoring weights, and locks them into hash-verified artifacts. During the online run, candidates are streamed in constant memory to extract structural and behavioral features into a columnar Candidate Quality Vector (CQV). Semantic hydration utilizes O(1) memory-mapped lookups of precomputed vectors rather than expensive on-the-fly encoding. Crucially, an upstream Gating Layer detects internally impossible 'honeypots' and explicit job mismatches, flooring their scores to zero before any relevance evaluation occurs. Base relevance is computed via a weighted sum of the CQV, which is then modulated by bounded behavioral and logistics multipliers. Finally, a deterministic stable sort isolates the top 100, and a Reasoning Engine generates non-templated explanations strictly tied to verifiable candidate facts to eliminate hallucination."

